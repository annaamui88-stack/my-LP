<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ringkasan Pesanan - AnnaAmui</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f4fbf7;
      margin: 0;
      padding: 16px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(22, 101, 52, 0.08);
      overflow: hidden;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .site-header {
      background: #ffffff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0fdf4;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #166534;
      letter-spacing: -0.5px;
    }
    .logo span {
      color: #d97706;
    }
    .badge-top {
      background: #fff7ed;
      color: #c2410c;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #ffedd5;
    }

    .order-banner {
      background: linear-gradient(135deg, #166534 0%, #14532d 100%);
      color: white;
      padding: 18px 20px;
      text-align: center;
    }
    .order-banner h2 {
      margin: 0 0 4px 0;
      font-size: 17px;
      font-weight: 600;
      word-break: break-all;
    }
    .order-banner p {
      margin: 0;
      font-size: 12px;
      opacity: 0.85;
    }

    .content-body {
      padding: 20px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #166534;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .info-icon {
      background: #dcfce7;
      color: #166534;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .info-detail {
      overflow: hidden;
    }
    .info-detail .label {
      font-size: 11px;
      color: #6b7280;
      font-weight: 500;
    }
    .info-detail .value {
      font-size: 14px;
      color: #1f2937;
      font-weight: 600;
      word-break: break-word;
    }

    .wa-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #25d366;
      color: white;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 12px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
    }

    .summary-box {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      margin-top: 18px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 10px;
      color: #4b5563;
    }
    .summary-row strong {
      color: #1f2937;
    }
    .summary-row.total {
      border-top: 1px solid #f3f4f6;
      padding-top: 10px;
      margin-top: 10px;
      font-weight: 700;
      color: #166534;
      font-size: 15px;
    }

    .site-footer {
      background: #f9fafb;
      padding: 14px 20px;
      text-align: center;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #6b7280;
    }
    .site-footer b {
      color: #166534;
    }
  </style>
</head>
<body>

  <div class="container" id="mainContainer">
    <div class="site-header">
      <div class="logo">Anna<span>Amui</span></div>
      <div class="badge-top">🇮🇩 Asli Indramayu</div>
    </div>

    <div class="order-banner">
      <h2 id="txtIdOrder">Memuat...</h2>
      <p id="txtBannerSub"><i class="fa-solid fa-spinner fa-spin" style="color: #4ade80;"></i> Sedang memuat data pesanan</p>
    </div>

    <div class="content-body" id="contentBody">
      <div style="text-align: center; padding: 30px; color: #6b7280; font-size: 14px;">
        Mohon tunggu sebentar...
      </div>
    </div>

    <div class="site-footer">
      Dicatat pada: <b id="txtTanggal">-</b>
    </div>
  </div>

  <script>
    // 1. Ambil ID dari URL (contoh: namewebanda.com/pesanan.html?id=ORD12345)
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');

    // 2. MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI (berakhiran /exec)
    const scriptURL = 'GANTI_DENGAN_URL_DEPLOYMENT_APPS_SCRIPT_ANDA';

    if (!orderId) {
      document.getElementById('txtIdOrder').innerText = 'Kesalahan';
      document.getElementById('txtBannerSub').innerHTML = 'ID Order tidak ditemukan';
      document.getElementById('contentBody').innerHTML = `
        <div style="text-align: center; padding: 20px; color: #dc2626; font-size: 14px;">
          Tautan tidak valid. Pastikan Anda mengakses halaman ini melalui link pesanan yang benar.
        </div>
      `;
    } else {
      // 3. Ambil data dari Google Apps Script
      fetch(scriptURL + '?id=' + orderId)
        .then(response => response.json())
        .then(res => {
          if (res.status === 'success') {
            const d = res.data;

            // Format nomor WhatsApp
            let rawPhone = String(d.nomor).replace(/\D/g, '');
            if (rawPhone.startsWith('0')) {
              rawPhone = '852' + rawPhone.slice(1);
            }
            const waMessage = encodeURIComponent(`Halo Kak ${d.nama}, terkait pesanan AnnaAmui dengan ID ${d.idOrder}...`);
            const waLink = `https://wa.me/${rawPhone}?text=${waMessage}`;

            // Tampilkan data ke elemen HTML
            document.getElementById('txtIdOrder').innerText = 'ID: ' + d.idOrder;
            document.getElementById('txtBannerSub').innerHTML = '<i class="fa-solid fa-circle-check" style="color: #4ade80;"></i> Status Pesanan Terverifikasi';
            document.getElementById('txtTanggal').innerText = d.tanggal;

            document.getElementById('contentBody').innerHTML = `
              <div class="section-title"><i class="fa-solid fa-user-check"></i> Informasi Penerima</div>

              <div class="info-card">
                <div class="info-icon"><i class="fa-solid fa-user"></i></div>
                <div class="info-detail">
                  <div class="label">Nama Penerima</div>
                  <div class="value">${d.nama}</div>
                </div>
              </div>

              <div class="info-card">
                <div class="info-icon"><i class="fa-solid fa-phone"></i></div>
                <div class="info-detail">
                  <div class="label">No WhatsApp</div>
                  <div class="value">${d.nomor}</div>
                </div>
              </div>

              <a href="${waLink}" target="_blank" class="wa-button">
                <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i> Chat WhatsApp Penerima
              </a>

              <div class="info-card" style="margin-top: 12px;">
                <div class="info-icon"><i class="fa-solid fa-location-dot"></i></div>
                <div class="info-detail">
                  <div class="label">Tempat Pengambilan / Lokasi</div>
                  <div class="value">${d.lokasi}</div>
                </div>
              </div>

              <div class="summary-box">
                <div class="section-title" style="font-size: 13px; margin-bottom: 12px;">
                  <i class="fa-solid fa-receipt"></i> Ringkasan Pesanan
                </div>
                <div class="summary-row">
                  <span>Original</span>
                  <strong>${d.original} Pack</strong>
                </div>
                <div class="summary-row">
                  <span>Pedas</span>
                  <strong>${d.pedas} Pack</strong>
                </div>
                <div class="summary-row">
                  <span>Total Pack</span>
                  <strong>${d.totalPack} Pack</strong>
                </div>
                <div class="summary-row">
                  <span>Harga / Pack</span>
                  <strong>HK$ ${d.harga}</strong>
                </div>
                <div class="summary-row total">
                  <span>Subtotal Barang</span>
                  <span>HK$ ${Number(d.total || 0).toLocaleString('id-ID')}</span>
                </div>
              </div>

              ${d.catatan ? `
                <div style="margin-top: 12px; font-size: 12px; color: #4b5563; background: #f3f4f6; padding: 10px 14px; border-radius: 8px; word-break: break-word;">
                  <b>Catatan:</b> ${d.catatan}
                </div>
              ` : ''}
            `;
          } else {
            document.getElementById('txtIdOrder').innerText = 'Tidak Ditemukan';
            document.getElementById('txtBannerSub').innerHTML = 'Data tidak terdaftar';
            document.getElementById('contentBody').innerHTML = `
              <div style="text-align: center; padding: 20px; color: #dc2626; font-size: 14px;">
                ${res.message}
              </div>
            `;
          }
        })
        .catch(err => {
          document.getElementById('txtIdOrder').innerText = 'Gagal';
          document.getElementById('txtBannerSub').innerHTML = 'Koneksi error';
          document.getElementById('contentBody').innerHTML = `
            <div style="text-align: center; padding: 20px; color: #dc2626; font-size: 14px;">
              Gagal terhubung ke sistem server. Silakan coba beberapa saat lagi.
            </div>
          `;
        });
    }
  </script>
</body>
</html>
