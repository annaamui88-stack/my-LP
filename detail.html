<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Pengiriman - AnnaAmui</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 20px; }
.container { max-width: 500px; margin: 40px auto; }
.card { background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }

/* Styling Logo AnnaAmui Sesuai Referensi */
.header-title { text-align: center; margin-bottom: 25px; }
.brand-logo {
    font-size: 28px;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: -0.5px;
    display: inline-block;
    margin-bottom: 4px;
}
.brand-anna { color: #165b33; } /* Hijau tua */
.brand-amui { color: #d97706; } /* Kuning/Oranye hangat */

.header-title p { font-size: 13px; color: var(--text-muted); }

.info-group { margin-bottom: 18px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; }
.info-group:last-child { border-bottom: none; }
.label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.value { font-size: 16px; font-weight: 600; color: var(--text-main); }
.btn-action { display: block; width: 100%; background: #25d366; color: white; text-align: center; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 600; margin-top: 25px; box-shadow: 0 4px 12px rgba(37,211,102,0.3); }
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-title">
            <div class="brand-logo">
                <span class="brand-anna">Anna</span><span class="brand-amui">Amui</span>
            </div>
            <p>Informasi Detail Pengiriman Paket</p>
        </div>

        <!-- Data Dinamis (Dari Parameter URL QR Code) -->
        <div class="info-group">
            <div class="label">ID Order</div>
            <div class="value" id="val-id">-</div>
        </div>

        <div class="info-group">
            <div class="label">Nama Penerima</div>
            <div class="value" id="val-nama">-</div>
        </div>

        <div class="info-group">
            <div class="label">Nomor Handphone Penerima</div>
            <div class="value" id="val-telp">-</div>
        </div>

        <div class="info-group">
            <div class="label">Tempat Pengambilan / Lokasi</div>
            <div class="value" id="val-lokasi">-</div>
        </div>

        <!-- Data Statis (Langsung Ditulis Tanpa Parameter) -->
        <div class="info-group">
            <div class="label">Pengirim</div>
            <div class="value">Umar</div>
        </div>

        <div class="info-group">
            <div class="label">Nomor Handphone Pengirim</div>
            <div class="value">083148789455</div>
        </div>

        <a id="btn-konfirmasi" href="#" target="_blank" class="btn-action">💬 Hubungi Admin Terkait Paket Ini</a>
    </div>
</div>

<script>
    // Membaca data parameter penerima dari URL QR Code
    const params = new URLSearchParams(window.location.search);
    
    document.getElementById('val-id').innerText = params.get('id') || 'Tidak Diketahui';
    document.getElementById('val-nama').innerText = params.get('nama') || '-';
    document.getElementById('val-telp').innerText = params.get('telp') || '-';
    document.getElementById('val-lokasi').innerText = params.get('lokasi') || '-';

    // Tombol WhatsApp dinamis berdasarkan data penerima
    const orderId = params.get('id') || 'PROMO';
    const penerima = params.get('nama') || '';
    const adminPhone = "62852XXXXXXXX"; // Ganti nomor WhatsApp Anda
    const textWp = `Halo Admin, saya ingin menanyakan status paket dengan ID Order: ${orderId} atas nama ${penerima}.`;
    
    document.getElementById('btn-konfirmasi').href = `https://wa.me/${adminPhone}?text=${encodeURIComponent(textWp)}`;
</script>

</body>
</html>
