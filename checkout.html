<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Anna Amui Shop</title>

<link rel="stylesheet" href="css/checkout.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- HEADER -->

<header class="topbar">

<div class="topbar-left">

<a href="index.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

</a>

<h2>Checkout</h2>

</div>

<div class="logo">

<img src="image/logo.png" alt="Anna Amui">

</div>

</header>

<!-- CONTENT -->

<div class="container">

<!-- INFORMASI -->

<div class="card">

<div class="card-title">

<i class="fa-solid fa-circle-info"></i>

<span>Informasi Penerima</span>

</div>

<div class="form-group">

<label>Nama Penerima</label>

<input
type="text"
id="nama"
placeholder="Masukkan nama penerima">

</div>

<div class="form-group">

<label>Nomor WhatsApp Hong Kong</label>

<input
type="tel"
id="nomor"
placeholder="Contoh : 51234567">

</div>

<div class="form-group">

<label>Tempat Pengambilan Paket</label>

<select id="pickup">

<option value="">Pilih Lokasi</option>

<option>Tsim Sha Tsui</option>

<option>Mong Kok</option>

<option>Central</option>

<option>Causeway Bay</option>

<option>Yuen Long</option>

<option>Tuen Mun</option>

<option>Tsuen Wan</option>

<option>Sha Tin</option>

<option>Fanling</option>

<option>Sheung Shui</option>

</select>

</div>

<div class="form-group">

<label>Catatan (Opsional)</label>

<textarea
id="catatan"
rows="3"
placeholder="Contoh : Hubungi sebelum pengantaran"></textarea>

</div>

</div>
