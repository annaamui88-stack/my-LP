    <div class="card-title">
        <i class="fa-solid fa-box"></i>
        <span>Pesanan Anda</span>
    </div>

    <div id="checkout-product">

<!-- =========================================================
     RINGKASAN
========================================================= -->

<div class="card">

    <div class="card-title">
        <i class="fa-solid fa-receipt"></i>
        <span>Ringkasan Pesanan</span>
    </div>


    <div class="summary-row">

        <span>Produk</span>

        <span id="summary-product">
            -
        </span>

    </div>


    <div class="summary-row">

        <span>Varian</span>

        <span id="summary-variant">
            -
        </span>

    </div>


    <div class="summary-row">

        <span>Total Pack</span>

        <b id="summary-quantity">
            0 Pack
        </b>

    </div>


    <div class="summary-row">

        <span>Harga / Pack</span>

        <b id="summary-price">
            HK$0
        </b>

    </div>


    <hr>


    <div class="summary-row">

        <span>Subtotal Barang</span>

        <b id="summary-total">
            HK$0
        </b>

    </div>


    <div class="summary-row">

        <span>📦 Estimasi Berat</span>

        <b id="estimasi-berat">
            0 Kg
        </b>

    </div>


    <div class="summary-row">

        <span>🚚 Estimasi Ongkir</span>

        <b id="estimasi-ongkir">
            HK$0
        </b>

    </div>


    <div class="summary-note">

        Ongkir hanya estimasi berdasarkan berat
        paket dan belum termasuk subtotal barang.

    </div>

</div>
